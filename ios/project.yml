# XcodeGen 工程描述文件。
#
# 用 XcodeGen 而不是提交 .xcodeproj，是为了让工程文件可读、可 review、
# 不会因为多人改动产生无法合并的 pbxproj 冲突。
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# 打包时可注入网关地址：
#   xcodebuild ... SPEAKMATE_GATEWAY=wss://api.yourdomain.com

name: SpeakMate

options:
  bundleIdPrefix: com.tianmaoyu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 未注入时留空，运行时回落到 Const 里的默认网关
    SPEAKMATE_GATEWAY: ""

targets:
  SpeakMate:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: SpeakMate
        PRODUCT_BUNDLE_IDENTIFIER: com.tianmaoyu.speakmate
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: SpeakMate
        CFBundleName: SpeakMate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 构建期注入的默认网关地址（可为空）
        SpeakMateGateway: $(SPEAKMATE_GATEWAY)
        NSMicrophoneUsageDescription: 需要麦克风权限，才能与 AI 老师实时对话练习口语。
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 允许用户把网关地址填成自建的 http/ws（例如局域网调试）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
