name: iOS CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway:
        description: "打包时注入的默认网关地址（留空则用源码默认值）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 iOS 包
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示工具链版本
        run: |
          xcodebuild -version
          swift --version

      # 工程文件由 project.yml 生成，仓库里不存 .xcodeproj，避免 pbxproj 冲突
      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建模拟器包
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SpeakMate.xcodeproj \
            -scheme SpeakMate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            SPEAKMATE_GATEWAY="${{ inputs.gateway }}" \
            build

      # 未签名 IPA：用 AltStore / Sideloadly / Xcode 自行签名后即可安装。
      # 仓库不持有任何开发者证书，公库也能安全构建。
      - name: 构建未签名 IPA
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SpeakMate.xcodeproj \
            -scheme SpeakMate \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            -archivePath build-device/SpeakMate.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SPEAKMATE_GATEWAY="${{ inputs.gateway }}" \
            archive
          ls -R build-device/SpeakMate.xcarchive/Products

      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          APP="ios/build-device/SpeakMate.xcarchive/Products/Applications/SpeakMate.app"
          cp -R "$APP" out/Payload/
          (cd out && zip -qry SpeakMate-unsigned.ipa Payload)

          # 路径随 Xcode 版本略有差异，找不到就全局搜一次
          SIM_APP="ios/build-sim/Build/Products/Debug-iphonesimulator/SpeakMate.app"
          if [ ! -d "$SIM_APP" ]; then
            SIM_APP="$(find ios/build-sim -type d -name 'SpeakMate.app' | head -1)"
          fi
          echo "模拟器包：$SIM_APP"
          test -d "$SIM_APP"
          ditto -c -k --sequesterRsrc --keepParent "$SIM_APP" out/SpeakMate-simulator.zip
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: speakmate-ios-${{ github.sha }}
          path: out/*
          retention-days: 30
          if-no-files-found: error

      # 与 android.yml 共享同一个 Release：先到者创建，后到者只上传。
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            if gh release create "$TAG" --title "SpeakMate $TAG" --notes-file docs/release-notes.md; then break; fi
            echo "创建 Release 时遇到并发竞态，第 $i 次重试"
            sleep 5
          done
          gh release upload "$TAG" out/* --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'
