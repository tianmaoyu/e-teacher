name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      gateway:
        description: "打包时注入的默认网关地址（留空则用源码默认值）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # runner 自带的 cmdline-tools 版本较旧，先换成 dl.google.com 直链的最新版。
      # 注意：API 37 起平台包改用小数版本命名（platforms;android-37.0），不再叫 android-37。
      - name: 安装 Android SDK 组件
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cd "$RUNNER_TEMP"
          curl -sSLo cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q -o cmdtools.zip
          rm -rf "$SDKROOT/cmdline-tools/latest"
          mv cmdline-tools "$SDKROOT/cmdline-tools/latest"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" > /dev/null
          echo "已安装：" && ls "$SDKROOT/platforms"

      - name: 赋予 gradlew 执行权限
        working-directory: android
        run: chmod +x ./gradlew

      - name: 构建 Debug APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug \
            ${{ inputs.gateway != '' && format('-Pspeakmate.gateway={0}', inputs.gateway) || '' }}

      # secrets 不能出现在 if 条件里，所以先在一个步骤里探测，
      # 把结果写成 output 供后续步骤判断。
      - name: 探测签名密钥
        id: sign
        env:
          KS_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            printf '%s' "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "已找到签名密钥，将产出已签名的 Release 包。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名密钥，Release 包将是未签名的（可正常安装用于测试）。"
          fi

      # 未配置 Secrets 时自动跳过签名。这样 fork / PR 不会因缺密钥而失败，
      # 仓库也可以放心保持 public。
      - name: 构建 Release APK
        working-directory: android
        env:
          SPEAKMATE_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          SPEAKMATE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPEAKMATE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SPEAKMATE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 整理产物
        run: |
          mkdir -p out
          SHA="${{ github.sha }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/speakmate-${SHA}-debug.apk" || true
          for f in $(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null); do
            cp "$f" "out/speakmate-${SHA}-release.apk"
          done
          ls -lh out

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: speakmate-apk-${{ github.sha }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 安装

            下载 `*-release.apk` 安装即可（未配置签名密钥时文件名相同但为未签名包，
            部分机型需先卸载旧版本）。

            ## 首次使用

            启动后输入运营方发放的兑换码激活，无需注册账号。
