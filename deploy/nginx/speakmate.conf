# ============================================================================
#  SpeakMate 网关 · nginx 反向代理
#
#  部署到 /etc/nginx/sites-available/speakmate，再 ln -s 到 sites-enabled。
#  把 api.speakmate.example 全局替换成你自己的域名。
#
#  设计取舍：这里**不**开启 HTTP/2。语音会话走的是 HTTP/1.1 的
#  Upgrade 升级（wss），HTTP/2 下 nginx 不支持这种升级方式，
#  开了反而会出问题。REST 接口量很小，HTTP/1.1 完全够用。
# ============================================================================

upstream speakmate_gateway {
    server 127.0.0.1:8787;
    keepalive 32;
}

# WebSocket 升级头：有 Upgrade 就转 upgrade，普通请求给 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 限流：单 IP 并发连接数与请求速率
limit_conn_zone $binary_remote_addr zone=speakmate_conn:10m;
limit_req_zone  $binary_remote_addr zone=speakmate_req:10m rate=20r/s;

# 升级请求里 Authorization 是 Bearer 令牌，日志要脱敏
log_format speakmate '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent $request_time '
                     'ua="$http_user_agent" dev="$http_x_device_id"';

server {
    listen 80;
    listen [::]:80;
    server_name api.speakmate.example;

    # 证书签发用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.speakmate.example;

    ssl_certificate     /etc/letsencrypt/live/api.speakmate.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.speakmate.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/speakmate.access.log speakmate;
    error_log  /var/log/nginx/speakmate.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;
    client_body_timeout  30s;

    # ------------------------------------------------------------------
    # 语音会话：长连接，必须关掉所有缓冲
    # ------------------------------------------------------------------
    location = /v1/live/sessions {
        limit_conn speakmate_conn 3;

        proxy_pass http://speakmate_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 会话上限 30 分钟，留一倍余量避免被中间设备先掐断
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;

        # 音频是实时流，进缓冲只会增加延迟
        proxy_buffering         off;
        proxy_request_buffering off;
        tcp_nodelay             on;
    }

    # ------------------------------------------------------------------
    # 其余业务接口
    # ------------------------------------------------------------------
    location /v1/ {
        limit_req zone=speakmate_req burst=40 nodelay;

        proxy_pass http://speakmate_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # 运营后台：只允许你自己的 IP 访问
    # 把 203.0.113.10 换成你的办公网 / 跳板机出口 IP
    # ------------------------------------------------------------------
    location /admin/ {
        allow 127.0.0.1;
        allow 203.0.113.10;
        deny  all;

        proxy_pass http://speakmate_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查不对公网暴露
    location = /health {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://speakmate_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}
